# vibe_tree_config.toml - Node.js Full-Stack Environment Configuration

[settings]
# 【階層制限】 これ以上深く潜らないための最大階層数（ストッパー機能）
max_depth_limit = 8

# デフォルト階層数（主要なコードや成果物が見える最適な深さ）
default_depth = 4

# 【完全非表示】 ツリーから存在自体を消し去るフォルダ・ファイル
# 開発に不要な各種キャッシュや、膨大なパッケージマネージャーの管理フォルダ
hide_dirs = [
    ".git",
    "node_modules",
    "__pycache__",
    ".vscode",
    ".idea",
    ".pnpm-store",
    ".yarn",
    ".next",
    ".nuxt",
    ".docusaurus",
    ".turbo",
    ".eslintcache",
    "coverage",
    ".nodemon",
    ".strapi",
    ".serverless"
]

# 【下層隠し】 フォルダ名は表示するが、その中身（自動生成ファイル等）は展開しない
exclude_dirs = [
    "venv",
    ".venv",
    "assets",
    "public",
    "static",
    "dist",
    "build",
    "out",
    ".output",
    "prisma/migrations"
]

# 【拡張子除外】 画面の視認性を下げる不要なファイルや一時ファイル
exclude_exts = [
    ".pyc",
    ".pyd",
    ".pyo",
    ".DS_Store",
    "Thumbs.db",
    ".log",
    ".old",
    ".map",
    "npm-debug.log",
    "yarn-error.log",
    "lock.json"
]

